<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Percentage Distribution Slider</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1; --card:#fff; --ink:#1f2328; --muted:#6b6f76; --line:#e4e2dc;
    --accent:#2f6f5e; --warn:#b4542d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17191c; --card:#202327; --ink:#e8e6e1; --muted:#9a9ea5; --line:#33373c; --accent:#6fbfa6; --warn:#e48a62; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);}
  main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
  h2{font-size:3rem;margin:0 0 18px}
  h3{font-size:2.5rem;margin:0 0 18px}
  h1{font-size:1.35rem;margin:0 0 18px}
    h2{font-family:'Orbitron','Noto Sans JP',sans-serif;font-weight:700;letter-spacing:.04em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  label.top{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
  input[type=number],input[type=text]{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  #total{font-size:1.4rem;width:100%;font-variant-numeric:tabular-nums}
  .mode{display:flex;gap:16px;margin-top:12px;font-size:.9rem;flex-wrap:wrap}
  .mode label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:10px 0 6px}
  .bar div{height:100%;transition:width .12s}
  .summary{display:flex;justify-content:space-between;font-size:.9rem;font-variant-numeric:tabular-nums}
  .summary .rem{font-weight:600}
  .summary .rem.full{color:var(--accent)}
  .row{padding:12px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .row-head{display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .row-head input[type=text]{flex:1;min-width:0;border-color:transparent;padding:4px 6px}
  .row-head input[type=text]:hover,.row-head input[type=text]:focus{border-color:var(--line)}
  .pct{width:76px;text-align:right;font-variant-numeric:tabular-nums}
  .amt{min-width:110px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .del{border:none;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 6px;border-radius:6px}
  .del:hover{color:var(--warn);background:var(--line)}
  input[type=range]{width:100%;margin-top:8px;accent-color:var(--ink)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  button.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.btn:hover{filter:brightness(.96)}
  .note{font-size:.8rem;color:var(--muted);margin-top:10px}
  .akari{display: flex;}
  .card, .bar, .del, button.btn, input[type=number], input[type=text]{border-radius:0}
</style>
</head>
<body>
<main>
   <h2>Space Mission Design Game</h2>
   <h1>You’ve been given a mission and a budget. You are the project manager. Think about how to allocate the budget to make this project succeed. Good luck!<br><br><br><br><br></h1>
   <h3 id="project"></h3>
   <img id="gazou" alt="Sample image" width="600" height="400">
  <h1>Percentage Distribution Slider</h1>

  <section class="card">
    <label class="top" for="total"></label>
    <div class="akari">
    <input id="total" type="text" disabled >＄
    </div>
    <div class="mode">
      <label><input type="radio" name="mode" value="cap" checked>Stop at 100%</label>
      <label><input type="radio" name="mode" value="auto">Automatically reduce the other items</label>
    </div>
  </section>

  <section class="card">
    <div class="bar" id="bar"></div>
    <div class="summary">
      <span id="used">use 0%</span>
      <span class="rem" id="rem">left 100%</span>
    </div>
  </section>

  <section class="card" id="list"></section>

  <div class="actions">
    <button class="btn" id="even">Split evenly</button>
    <button class="btn" id="reset">Everything to zero percent</button>
    <button class="btn" id="copy">copy results</button>
  </div>
  <p class="note" id="msg"></p>
<div id="result-contener">
    <button class="btn primary" id="result">Show results</button>
  </div>
  

  <script src="main.js"></script>
</main>



</body>
</html>
</script>
